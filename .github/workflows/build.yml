name: Build & Release TerraSync APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.p12
          fi

      - name: Run Unit Tests (-Xmx128m Stress & Regression)
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE || 'release-keystore.p12' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/release/app-release.apk "TerraSync-${VERSION}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerraSync-release
          path: TerraSync-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TerraSync-*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
